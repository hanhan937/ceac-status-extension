<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>US Visa Status Check Prefill</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="popup">
    <main>
      <header>
        <h1>US Visa Application Status</h1>
        <button id="settings" class="icon-button" type="button" title="Settings" aria-label="Settings">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M12 15.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5Z"></path>
            <path d="M19.4 15a8 8 0 0 0 .1-1 8 8 0 0 0-.1-1l2-1.5-2-3.5-2.4 1a8 8 0 0 0-1.8-1L15 5.4h-4L10.8 8a8 8 0 0 0-1.8 1L6.6 8l-2 3.5 2 1.5a8 8 0 0 0-.1 1 8 8 0 0 0 .1 1l-2 1.5 2 3.5 2.4-1a8 8 0 0 0 1.8 1l.2 2.6h4l.2-2.6a8 8 0 0 0 1.8-1l2.4 1 2-3.5-2-1.5Z"></path>
          </svg>
        </button>
      </header>
      <p id="summary" class="summary">Checking configuration...</p>
      <button id="open" class="primary" type="button">Open and Prefill</button>
      <p id="status" class="status" role="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
